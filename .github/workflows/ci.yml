name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is verified by the deploy workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint · Typecheck · Build · SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:admin
      - run: npm run typecheck
      - run: npm run build
      - run: npm run seo:audit
      # The site must also work when hosted under a sub-path (GitHub project site: user.github.io/<repo>/)
      - name: Build for a sub-path and verify every URL resolves
        env:
          NEXT_PUBLIC_SITE_URL: https://example.github.io/my-repo
        run: npm run build && npm run check:subpath

  backend:
    name: Google Sheets backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run backend:test
