name: Deploy site

# Builds the static site (Next.js export) and publishes it to GitHub Pages.
# Runs on: every push to main · manual run · repository_dispatch event.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Has content changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: v
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/fetch-content.mjs --check
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_BACKEND: "true"   # never publish a site that silently lost its admin-edited content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
      - name: SEO audit (warnings never block a deploy)
        run: npm run seo:audit || echo "::warning::SEO audit reported problems — see the log above"
      - name: Check that every link, script, style and image resolves under the site's address
        run: npm run check:subpath || echo "::warning::Some internal URLs do not resolve — see the log above"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
