<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Vibrant Data/AI Accent Gradient -->
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Pulse Animation -->
    <style type="text/css">
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .data-stream {
        stroke-dasharray: 4 2;
        animation: flow 10s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes flow {
        to { stroke-dashoffset: -60; }
      }
    </style>
  </defs>

  <!-- Background Rounded Shield/Tile -->
  <rect x="4" y="4" width="92" height="92" rx="20" ry="20" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Neural Connection Network Lines -->
  <g opacity="0.25" stroke="url(#dataGradient)" stroke-width="1" stroke-linecap="round">
    <line x1="20" y1="25" x2="80" y2="25" class="data-stream" />
    <line x1="20" y1="75" x2="80" y2="75" class="data-stream" />
    <line x1="25" y1="20" x2="25" y2="80" class="data-stream" />
    <line x1="75" y1="20" x2="75" y2="80" class="data-stream" />
  </g>

  <!-- Stylized Data Science Curves & Monogram Framework -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trend & Distribution Curve (The S/M flow) -->
    <path d="M22 68 C 32 68, 35 32, 50 32 C 65 32, 68 68, 78 68" stroke="url(#dataGradient)" stroke-width="4.5" />
          
    <!-- Dynamic Secondary Data Line -->
    <path d="M22 32 C 38 32, 42 75, 50 75 C 58 75, 62 45, 78 45" stroke="#38BDF8" stroke-width="2.5" opacity="0.75" />
  </g>

  <!-- Data Nodes (Scatter Plot Points) -->
  <g fill="url(#dataGradient)">
    <circle cx="22" cy="68" r="3.5" class="pulse-node" style="transform-origin: 22px 68px;" />
    <circle cx="50" cy="32" r="4.5" class="pulse-node" style="transform-origin: 50px 32px;" />
    <circle cx="78" cy="68" r="3.5" class="pulse-node" style="transform-origin: 78px 68px;" />
    <circle cx="36" cy="48" r="2.5" />
    <circle cx="64" cy="52" r="2.5" />
  </g>

  <!-- Typography: Initials & Role -->
  <text x="50" y="86" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#F8FAFC" letter-spacing="2.5" text-anchor="middle">S M F R</text>
        
  <text x="50" y="91" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="400" fill="#94A3B8" letter-spacing="1.2" text-anchor="middle">DATA SCIENCE</text>
</svg>
